name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: repo contents + PR metadata (gitleaks lists PR commits
# via the API on pull_request events — without pull-requests:read it 403s).
permissions:
  contents: read
  pull-requests: read

# Cancel superseded runs on the same branch/PR to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install · Typecheck · Lint · Build · Audit
    runs-on: ubuntu-latest
    # A hung step should not burn a runner for six hours (the GitHub default).
    # The job normally finishes in a few minutes; 20 is generous headroom.
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so the secret scan covers every commit in the PR.
          fetch-depth: 0

      # Fails the run if a secret is committed (WORKFLOW.md / TECH-ARCHITECTURE §16).
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # pnpm version comes from the "packageManager" field in package.json.
      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      # Code Check 6 (docs/TECHNICAL-INTEGRITY.md), added at SYS1 1h.
      #
      # BLOCKING at "critical" only, and that threshold is a deliberate,
      # recorded choice rather than a soft one: on 2026-08-21 this repo had
      # 22 advisories — 0 critical, 14 high, 8 moderate — so gating at "high"
      # would have shipped a permanently red CI, which teaches everyone to
      # ignore it. "No known-critical vulnerabilities" is also the standard
      # docs/TECHNICAL-INTEGRITY.md actually states.
      #
      # The highs are NOT dismissed: the step below reports them on every run,
      # and the outstanding ones are tracked in PROJECT-STATUS.md §7. Raise
      # this gate to "high" once that backlog is cleared.
      - name: Audit (blocking — critical only)
        run: pnpm audit --audit-level critical

      # Visibility, not a gate: prints high/moderate advisories so a reviewer
      # sees them on the PR instead of discovering them at the next upgrade.
      - name: Audit report (non-blocking — high & moderate)
        if: always()
        continue-on-error: true
        run: pnpm audit --audit-level moderate || true
